php-version: 8.4
extensions: "bcmath,brotli,bz2,calendar,ctype,curl,dom,exif,fileinfo,filter,gd,iconv,intl,libxml,mbregex,mbstring,mysqli,mysqlnd,openssl,pdo,pdo_sqlite,phar,session,simplexml,sqlite3,tokenizer,xml,xmlwriter,xmlreader,zip,zlib"
sapi:
  - cli
verbosity: 256
download-options:
  retry: 5
  ignore-cache: php-src
  prefer-binary: true
build-options:
  with-upx-pack: true
